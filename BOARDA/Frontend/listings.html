<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find and compare student boarding houses by location, monthly price, room type, and amenities.">
    <link rel="stylesheet" href="style.css">
    <script src="listings-gallery.js" defer></script>
    <script src="listings-search.js" defer></script>
    <script src="auth-interactions.js" defer></script>
    <title>Boarding House Listings | Boarda</title>
  </head>
  <body>
    <header>
      <a href="index.html"><img src="../Images/logo.png" alt="Boarda" width="300"></a>
    </header>
    <nav aria-label="primary navigation">
      <a href="index.html">Home</a>
      <a href="aboutUs.html">About Us</a>
      <a href="listings.html">Listings</a>
      <a href="register.html">Register</a>
      <a href="login.html">Login</a>
      <a href="howItWorks.html">How It Works</a>
    </nav>

    <main class="listings-page">
      <h1>Browse Boarding Houses</h1>
      <div class="listings-layout">
        <aside aria-label="Filter listings">
          <form id="listing-filters" action="listings.html" method="get">
            <label for="location-filter">Campus or area</label>
            <input type="search" id="location-filter" name="location" maxlength="255" placeholder="e.g. Northrise">

            <label for="min-price-filter">Minimum monthly price (ZMW)</label>
            <input type="number" id="min-price-filter" name="min_price" min="0" step="50" placeholder="Any">

            <label for="max-price-filter">Maximum monthly price (ZMW)</label>
            <input type="number" id="max-price-filter" name="max_price" min="0" step="50" placeholder="Any">

            <label for="room-type-filter">Room type</label>
            <select id="room-type-filter" name="room_type">
              <option value="">Any</option>
              <option value="single">Single</option>
              <option value="shared">Shared</option>
              <option value="self-contained">Self-contained</option>
            </select>

            <fieldset class="amenity-filters">
              <legend>Amenities</legend>
              <label><input type="checkbox" name="amenity" value="wifi"> Wi-Fi</label>
              <label><input type="checkbox" name="amenity" value="water"> Water</label>
              <label><input type="checkbox" name="amenity" value="furnished"> Furnished</label>
              <label><input type="checkbox" name="amenity" value="security-24-7"> 24/7 security</label>
            </fieldset>

            <button type="submit">Apply filters</button>
            <a id="clear-listing-filters" href="listings.html" hidden>Clear filters</a>
          </form>
        </aside>

        <section class="listing-results" aria-label="Boarding house results">
          <p id="listing-results-count" role="status" aria-live="polite">Loading listings…</p>
          <div id="listing-results-items" class="listing-results-grid"></div>
        </section>
      </div>
    </main>

    <dialog id="listing-image-viewer" class="listing-image-viewer" aria-label="Property photo viewer">
      <button class="image-viewer-close" type="button" aria-label="Close photo viewer">×</button>
      <button class="image-viewer-previous" type="button" aria-label="Previous photo">‹</button>
      <figure>
        <img id="listing-viewer-image" alt="">
        <figcaption id="listing-viewer-caption"></figcaption>
      </figure>
      <button class="image-viewer-next" type="button" aria-label="Next photo">›</button>
      <p id="listing-viewer-count" class="image-viewer-count" aria-live="polite"></p>
    </dialog>

    <footer>
      <nav aria-label="footer navigation">
        <a href="index.html">Home</a>
        <a href="aboutUs.html">About Us</a>
        <a href="listings.html">Listings</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="howItWorks.html">How It Works</a>
        <a href="contactUs.html">Contact Us</a>
      </nav>
      <span>&copy; Boarda team 2026. All Rights Reserved.</span>
    </footer>
  </body>
</html>
