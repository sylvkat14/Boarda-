<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your Boarda account profile.">
    <link rel="stylesheet" href="style.css">
    <script src="auth-interactions.js" defer></script>
    <script src="profile.js" defer></script>
    <title>Your Profile | Boarda</title>
  </head>
  <body>
    <header>
      <a href="index.html"><img src="../Images/logo.png" alt="Boarda" width="300"></a>
    </header>
    <nav aria-label="primary navigation">
      <a href="index.html">Home</a>
      <a href="aboutUs.html">About Us</a>
      <a href="listings.html">Listings</a>
      <a href="register.html">Register</a>
      <a href="login.html">Login</a>
      <a href="howItWorks.html">How It Works</a>
    </nav>
    <main class="profile-page">
      <section class="profile-card" aria-labelledby="profile-title">
        <p class="eyebrow">Account</p>
        <h1 id="profile-title">Your profile</h1>
        <p class="subtitle">Your Boarda account details.</p>
        <p id="profile-status" class="dashboard-status" role="status" aria-live="polite">Loading your profile…</p>
        <dl id="profile-details" class="profile-details" hidden>
          <div><dt>Name</dt><dd id="profile-name"></dd></div>
          <div><dt>Email</dt><dd id="profile-email"></dd></div>
          <div><dt>Account type</dt><dd id="profile-role"></dd></div>
        </dl>
        <a id="profile-dashboard-link" class="btn-primary" href="student-dashboard.html" hidden>Go to dashboard</a>
      </section>
    </main>
    <footer>
      <nav aria-label="footer navigation">
        <a href="index.html">Home</a>
        <a href="aboutUs.html">About Us</a>
        <a href="listings.html">Listings</a>
        <a href="howItWorks.html">How It Works</a>
        <a href="contactUs.html">Contact Us</a>
      </nav>
      <span>&copy; Boarda team 2026. All Rights Reserved.</span>
    </footer>
  </body>
</html>
