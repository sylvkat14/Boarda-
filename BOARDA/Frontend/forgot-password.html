<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a secure password reset link for your Boarda account.">
    <link rel="stylesheet" href="style.css">
    <script src="auth-interactions.js" defer></script>
    <script src="password-recovery.js" defer></script>
    <title>Reset Password | Boarda</title>
  </head>
  <body>
    <header>
      <a href="index.html"><img src="../Images/logo.png" alt="Boarda" width="300"></a>
    </header>
    <nav aria-label="primary navigation">
      <a href="index.html">Home</a>
      <a href="aboutUs.html">About Us</a>
      <a href="listings.html">Listings</a>
      <a href="register.html">Register</a>
      <a href="login.html">Login</a>
      <a href="howItWorks.html">How It Works</a>
    </nav>
    <main>
      <section class="auth-card">
        <h1>Forgot your password?</h1>
        <p class="subtitle">Enter the email address linked to your Boarda account and we'll send you a reset link.</p>
        <form data-password-reset-request>
          <label for="recovery-email">Email</label>
          <input id="recovery-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <button type="submit">Send reset link</button>
          <p class="auth-status" role="status" aria-live="polite" hidden></p>
          <p><a href="login.html">Back to login</a></p>
        </form>
      </section>
    </main>
    <footer>
      <span>&copy; Boarda team 2026. All Rights Reserved.</span>
    </footer>
  </body>
</html>
