<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your Boarda account.">
    <link rel="stylesheet" href="style.css">
    <script src="auth-interactions.js" defer></script>
    <script src="password-recovery.js" defer></script>
    <title>Choose a New Password | Boarda</title>
  </head>
  <body>
    <header>
      <a href="index.html"><img src="../Images/logo.png" alt="Boarda" width="300"></a>
    </header>
    <nav aria-label="primary navigation">
      <a href="index.html">Home</a>
      <a href="aboutUs.html">About Us</a>
      <a href="listings.html">Listings</a>
      <a href="register.html">Register</a>
      <a href="login.html">Login</a>
      <a href="howItWorks.html">How It Works</a>
    </nav>
    <main>
      <section class="auth-card">
        <h1>Choose a new password</h1>
        <p class="subtitle">Use a password between 8 and 128 characters.</p>
        <form data-password-reset-complete>
          <label for="new-password">New password</label>
          <div class="password-field">
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            <button class="password-toggle" type="button" data-password-toggle="new-password" aria-controls="new-password" aria-pressed="false">Show</button>
          </div>
          <label for="confirm-new-password">Confirm new password</label>
          <div class="password-field">
            <input id="confirm-new-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            <button class="password-toggle" type="button" data-password-toggle="confirm-new-password" aria-controls="confirm-new-password" aria-pressed="false">Show</button>
          </div>
          <button type="submit">Save new password</button>
          <p class="auth-status" role="status" aria-live="polite" hidden></p>
          <p><a href="login.html">Back to login</a></p>
        </form>
      </section>
    </main>
    <footer>
      <span>&copy; Boarda team 2026. All Rights Reserved.</span>
    </footer>
  </body>
</html>
